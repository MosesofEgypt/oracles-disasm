- group: 0x55
  data:
  - name: TX_550d
    index: 0x0d
    text: |-
      \pos(2)Save and quit?
        \opt()No \opt()Yes
  - name: TX_550e
    index: 0x0e
    text: |-
      \pos(2)If you don't
      save, you cannot
      continue on
      your quest.
      Is this OK?
        \opt()No \opt()Yes