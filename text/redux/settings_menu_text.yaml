groups:
- group: 0x09
  data:
  - name: TX_09_MESSAGE_SPEED
    index: 0x6e
    text: |-
      Message Speed
      How quickly text appears.
      Speed 8 is instantaneous.

  - name: TX_09_PASSIVE_SHIELD
    index: 0x6f
    text: |-
      Passive Shield
      Shield is passively
      held at all times.

  - name: TX_09_DUNGEON_AUTOSAVE
    index: 0x70
    text: |-
      Dungeon Autosave
      Game is saved
      upon entering or
      exiting a dungeon.

  - name: TX_09_BRACELET_PUNCH
    index: 0x71
    text: |-
      Bracelet Punch
      Bracelet usage
      becomes punch if
      nothing grabbable
      (requires ring).

  - name: TX_09_CONTEXT_SENSITIVE_ITEMS
    index: 0x72
    text: |-
      Contextual Items
      Items are auto-equipped
      when pressing/standing on
      an area they can be used.

  - name: TX_09_CONTEXT_SENSITIVE_BUTTON
    index: 0x73
    text: |-
      Context Button
      The button that all
      contextual items
      are equipped to.

  - name: TX_09_LOW_HEART_WARNING
    index: 0x74
    text: |-
      Low-Heart Beep
      A warning sound will play
      while you are at 1/4 or
      less of your max health.

  - name: TX_09_QUICK_SWAP
    index: 0x75
    text: |-
      Quick Swapping
      Hold Select to swap
      \abtn/\bbtn items with
      the first two inventory
      items. Release without
      pressing \abtn/\bbtn to
      open the map.